name: Marketapp Watcher

# There is no cron trigger firing every minute here -- GitHub enforces a
# 5-minute floor on the `schedule:` trigger and won't accept anything
# shorter. Instead: the bot itself polls every POLL_INTERVAL_SECONDS (60s,
# see config.py) inside its own internal loop, for as long as ONE workflow
# run/job stays alive. That 5-minute floor only limits how often GitHub
# will *start a new job* -- it says nothing about what a job does once
# it's running. So a single job that loops forever internally sidesteps
# it entirely; per-minute checks happen inside the job, not via cron.
#
# The catch: GitHub caps any single job at 6 hours of execution
# (https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes).
# So this schedule's real job is just to relaunch a fresh run periodically,
# well before the current one hits that wall -- and `concurrency:` below
# makes sure the new run cancels the old one, so there's a clean handoff
# and never two bots running (and double-notifying) at once.
on:
  workflow_dispatch: {}  # lets you manually (re)start it from the Actions tab
  schedule:
    - cron: "0 */5 * * *"  # relaunch every 5 hours -- comfortably inside the 6h cap

concurrency:
  group: marketapp-watcher
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5h50m -- ends itself cleanly before GitHub's 6h hard limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MARKETAPP_API_KEY: ${{ secrets.MARKETAPP_API_KEY }}
          # Python buffers stdout by default when it's not attached to an
          # interactive terminal (like a CI runner) -- prints get held back
          # until the buffer fills or the process exits, so logs would show
          # up in big delayed chunks instead of live. -u (and/or this env
          # var) forces unbuffered output so `print()` shows up immediately.
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py
